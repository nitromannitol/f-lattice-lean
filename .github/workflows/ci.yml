name: CI

# Build the library, then report the axioms of the headline declarations. Mathlib-scale, so the workflow runs on pushes
# to main and on request.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A running build is never cancelled: GitHub keeps it and holds only the newest pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Lean (Lean 4.32.0) and the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      # The library build is reused across runs: only the modules whose sources or imports changed are compiled again.
      # It is saved at the end of every run (see the last step), so an interrupted run still shortens the next one.
      - name: Restore the library build
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-lean4.32.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lake-build-lean4.32.0-

      # Sums the resident memory of the lean processes every 30 seconds into memory.log, so the job log shows the peak
      # of the summed memory of the concurrent elaborations (the runner has 16 GB).
      - name: Start the memory sampler
        shell: bash
        run: |
          cat > memory-sampler.sh <<'SAMPLER'
          #!/usr/bin/env bash
          while true; do
            total=$(ps -C lean -o rss= | awk '{ s += $1 } END { print s + 0 }')
            echo "$(date -u +%H:%M:%S) lean RSS total KB: ${total}" >> memory.log
            sleep 30
          done
          SAMPLER
          chmod +x memory-sampler.sh
          nohup ./memory-sampler.sh > /dev/null 2>&1 &
          echo $! > memory-sampler.pid

      # Lake 4.32 has no job flag; LEAN_NUM_THREADS caps its concurrent elaborations (measured: 2 threads gives a peak of
      # 4 concurrent lean processes, against 10 with the default), which bounds the peak memory on the hosted runner.
      - name: Build the library
        # A step limit below the apparent hour: a slow build ends as a timed-out step, so the save step still runs.
        timeout-minutes: 40
        shell: bash
        env:
          LEAN_NUM_THREADS: "2"
        run: |
          set -o pipefail
          lake build FLatticePaper 2>&1 | tee build.log

      - name: Stop the memory sampler and print its log
        if: always()
        shell: bash
        run: |
          if [ -f memory-sampler.pid ]; then kill "$(cat memory-sampler.pid)" 2>/dev/null || true; fi
          cat memory.log 2>/dev/null || echo "no memory samples were taken"

      - name: Fail on any error or warning
        shell: bash
        run: |
          if grep -E '^(error|warning):' build.log; then
            echo "The library build emitted an error or a warning."
            exit 1
          fi

      - name: Axiom report of the headline declarations
        shell: bash
        run: |
          set -o pipefail
          lake env lean checks/HeadlineAxiomReport.lean 2>&1 | tee axioms.log
          python3 tools/check_axioms.py axioms.log

      # Saved even when the build fails: lake checks each module against its trace, so a partial cache only saves work.
      - name: Save the library build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-lean4.32.0-${{ github.run_id }}-${{ github.run_attempt }}
